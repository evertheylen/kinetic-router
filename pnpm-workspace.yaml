packages:
  - definition
  - url
  - solid
  - lifecycle
  - animations
  - example-app
  - integration-tests
  - testing-utils

allowBuilds:
  esbuild: true

catalog:
  '@dovetail-js/utils': ^0.8.0
  '@playwright/test': ^1.64.1
  # Solid 2 and its Vite plugin are still prereleases; keep compatible versions pinned.
  '@solidjs/vite-plugin': 3.0.0-next.50
  '@solidjs/web': 2.0.0-rc.15
  '@types/dom-navigation': ^1.0.7
  '@types/node': ^26.6.5
  happy-dom: ^21.0.3
  solid-js: 2.0.0-rc.15
  typescript: ^7.0.2
  vite: ^8.3.4
  vitest: ^5.0.5

catalogMode: prefer

onlyBuiltDependencies:
  - esbuild

preferWorkspacePackages: true
